# Strict hardening drop-in — OPT IN, deliberately.
#
# Install with:
#
#   sudo mkdir -p /etc/systemd/system/meshnode.service.d
#   sudo cp meshnode-hardened.conf \
#           /etc/systemd/system/meshnode.service.d/hardened.conf
#   sudo systemctl daemon-reload && sudo systemctl restart meshnode
#
# ---------------------------------------------------------------------------
# Why this is a drop-in and not the default
# ---------------------------------------------------------------------------
#
# meshnode spawns your commands. Every restriction in this file is inherited
# by every job the executor runs, which means a syscall filter here is not a
# statement about the daemon — it is a statement about **your workloads**.
#
# meshware does not know what your jobs legitimately call. Shipping a filter
# by default would mean shipping a guess, and the failure mode of a wrong
# guess is a job that dies with SIGSYS and a stack trace that points at
# systemd rather than at anything you wrote. So the shipped unit hardens
# everything that cannot affect a job (see meshnode.service), and the two
# directives that can are here, for fleets whose jobs are known and narrow.
#
# Good candidates: a fleet that only runs `bash`, `python` and `ansible`
# against network devices. Bad candidates: build farms (`meshnode cc`),
# anything using containers or `unshare`, GPU training with a JIT in it,
# anything you have not tested.
#
# **Test it on one node first.** `meshnode drain --until` one box, apply,
# restart, run your real workload, and read `journalctl -u meshnode` for
# `SYS_seccomp` denials before you roll it anywhere.
#
# ---------------------------------------------------------------------------

[Service]
# @system-service is systemd's own allow-list for ordinary services. The
# subtractions below are the groups a scheduler daemon and normal job
# workloads have no business in. @resources is NOT subtracted: setrlimit,
# sched_setaffinity and nice are exactly what a compute job legitimately
# does, and meshware's own doctrine is to saturate the machine.
SystemCallFilter=@system-service
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
SystemCallErrorNumber=EPERM

# Blocks unshare(2) and clone(2) namespace flags. Drop this line if your
# jobs use a container runtime, bubblewrap, or `unshare` for any reason.
RestrictNamespaces=~CLONE_NEWUSER CLONE_NEWPID CLONE_NEWNET CLONE_NEWNS CLONE_NEWUTS CLONE_NEWIPC CLONE_NEWCGROUP

# Hides other users' processes. Costs one fact — init-system detection reads
# /proc/1/comm and will report unknown — and nothing else.
ProtectProc=invisible
