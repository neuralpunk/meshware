[package]
name = "mesh-proto"
description = "meshware wire protocol: message types, protocol versioning, frame codec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
semver = { workspace = true }
blake3 = { workspace = true }
data-encoding = { workspace = true }
getrandom = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
# C5 §9.1: the device *request* is JSON inside the job environment, because
# it is the one requirement shape that will keep growing (MIG profiles,
# topology terms) and a self-describing encoding lets an older executor
# read the fields it knows instead of failing the decode.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
